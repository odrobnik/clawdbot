<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenClaw Web Phone</title>
<style>
  :root { --bg: #0f0f0f; --surface: #1a1a1a; --border: #2a2a2a; --text: #e0e0e0; --muted: #888; --green: #22c55e; --red: #ef4444; --blue: #3b82f6; --amber: #f59e0b; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .container { width: 100%; max-width: 440px; padding: 24px; }
  h1 { font-size: 1.3rem; font-weight: 600; margin-bottom: 6px; text-align: center; color: var(--muted); }
  .build { text-align: center; color: var(--muted); font-size: 0.72rem; margin-bottom: 14px; opacity: 0.85; }
  .status-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; font-size: 0.85rem; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
  .status-dot.connected { background: var(--green); }
  .status-dot.error { background: var(--red); }
  .state-label { margin-left: auto; color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .state-label.listening { color: var(--green); }
  .state-label.thinking { color: var(--amber); }
  .state-label.speaking { color: var(--blue); }
  .transcript { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; height: 340px; overflow-y: auto; padding: 14px; margin-bottom: 16px; font-size: 0.9rem; line-height: 1.5; }
  .transcript:empty::before { content: 'Conversation will appear here…'; color: var(--muted); font-style: italic; }
  .msg { margin-bottom: 10px; }
  .msg.user { color: var(--green); }
  .msg.agent { color: var(--blue); }
  .msg.partial { }
  .msg .label { font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 2px; }
  .btn { display: block; width: 100%; padding: 16px; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: background 0.2s, transform 0.1s; }
  .btn:active { transform: scale(0.98); }
  .btn-call { background: var(--green); color: #000; }
  .btn-call:hover { background: #16a34a; }
  .btn-hangup { background: var(--red); color: #fff; }
  .btn-hangup:hover { background: #dc2626; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
<div class="container">
  <h1>🎙️ OpenClaw Web Phone</h1>
  <div class="build" id="buildLabel"></div>
  <div class="status-bar">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Disconnected</span>
    <span class="state-label" id="stateLabel"></span>
  </div>
  <div class="transcript" id="transcript"></div>
  <button class="btn btn-call" id="callBtn" onclick="toggleCall()">🎤 Call</button>
</div>

<script>
// ─── Configuration ───────────────────────────────────────────
const WEB_PHONE_BUILD = "2026-02-19-fullband-pcm16-v1";
const qs = new URLSearchParams(window.location.search);
const defaultWsPath = window.location.pathname.endsWith('/phone')
  ? window.location.pathname.slice(0, -6)
  : '/voice/web';
const wsScheme = window.location.protocol === 'https:' ? 'wss' : 'ws';
const WS_URL = window.location.host
  ? `${wsScheme}://${window.location.host}${defaultWsPath}`
  : 'ws://localhost:3334/voice/web';
const TOKEN = qs.get('token') || '';
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
// ─────────────────────────────────────────────────────────────

const TARGET_SAMPLE_RATE = 16000;
const PLAYBACK_RING_BUFFER_SECONDS = 5;
const PLAYBACK_PRIME_MS = 200;
const PCM_PLAYER_PROCESSOR_NAME = 'pcm-player-processor';
const PCM_PLAYER_WORKLET_SOURCE = `
class PcmPlayerProcessor extends AudioWorkletProcessor {
  constructor(options) {
    super();
    const processorOptions = options && options.processorOptions ? options.processorOptions : {};
    const ringBufferSeconds = Math.max(1, Number(processorOptions.ringBufferSeconds) || 5);
    this.capacity = Math.max(128, Math.floor(sampleRate * ringBufferSeconds));
    this.ringBuffer = new Float32Array(this.capacity);
    this.readIndex = 0;
    this.writeIndex = 0;
    this.bufferedSamples = 0;
    const primeMs = Math.max(0, Number(processorOptions.primeMs) || 0);
    this.primeSamples = Math.floor((sampleRate * primeMs) / 1000);
    this.primed = this.primeSamples === 0;

    this.port.onmessage = (event) => {
      const payload = event.data;
      if (!payload) return;
      if (payload === 'clear' || payload.type === 'clear') {
        this.clear();
        return;
      }
      if (payload instanceof Float32Array) {
        this.pushSamples(payload);
      }
    };
  }

  clear() {
    this.readIndex = 0;
    this.writeIndex = 0;
    this.bufferedSamples = 0;
    this.primed = this.primeSamples === 0;
  }

  pushSamples(samples) {
    const length = samples.length;
    if (length <= 0) return;

    if (length >= this.capacity) {
      const start = length - this.capacity;
      for (let i = 0; i < this.capacity; i++) {
        this.ringBuffer[i] = samples[start + i];
      }
      this.readIndex = 0;
      this.writeIndex = 0;
      this.bufferedSamples = this.capacity;
      this.primed = this.primeSamples === 0 || this.bufferedSamples >= this.primeSamples;
      return;
    }

    const overflow = this.bufferedSamples + length - this.capacity;
    if (overflow > 0) {
      this.readIndex += overflow;
      if (this.readIndex >= this.capacity) {
        this.readIndex -= this.capacity;
      }
      this.bufferedSamples -= overflow;
    }

    const tailSpace = this.capacity - this.writeIndex;
    const firstCopy = length < tailSpace ? length : tailSpace;
    for (let i = 0; i < firstCopy; i++) {
      this.ringBuffer[this.writeIndex + i] = samples[i];
    }

    const remaining = length - firstCopy;
    if (remaining > 0) {
      for (let i = 0; i < remaining; i++) {
        this.ringBuffer[i] = samples[firstCopy + i];
      }
    }

    this.writeIndex += length;
    if (this.writeIndex >= this.capacity) {
      this.writeIndex -= this.capacity;
    }
    this.bufferedSamples += length;
    if (!this.primed && this.bufferedSamples >= this.primeSamples) {
      this.primed = true;
    }
  }

  process(_, outputs) {
    const output = outputs[0];
    if (!output || output.length === 0) return true;
    const channel = output[0];
    if (!channel) return true;

    const frames = channel.length;
    if (!this.primed) {
      for (let i = 0; i < frames; i++) {
        channel[i] = 0;
      }
      if (this.bufferedSamples >= this.primeSamples) {
        this.primed = true;
      }
    } else {
      let available = this.bufferedSamples;
      let readIndex = this.readIndex;
      for (let i = 0; i < frames; i++) {
        if (available > 0) {
          channel[i] = this.ringBuffer[readIndex];
          readIndex++;
          if (readIndex === this.capacity) {
            readIndex = 0;
          }
          available--;
        } else {
          channel[i] = 0;
        }
      }
      this.readIndex = readIndex;
      this.bufferedSamples = available;
      if (available === 0 && this.primeSamples > 0) {
        this.primed = false;
      }
    }

    for (let c = 1; c < output.length; c++) {
      const outChannel = output[c];
      for (let i = 0; i < frames; i++) {
        outChannel[i] = channel[i];
      }
    }

    return true;
  }
}

registerProcessor('${PCM_PLAYER_PROCESSOR_NAME}', PcmPlayerProcessor);
`;

let ws = null;
let audioCtx = null;
let micStream = null;
let scriptNode = null;
let playbackNode = null;
let connected = false;
let lastFinalUserText = '';
let speechRecog = null;
let speechRecogShouldRestart = false;
let speechRecogMuted = false;

const btn = document.getElementById('callBtn');
const transcript = document.getElementById('transcript');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const stateLabel = document.getElementById('stateLabel');
const buildLabel = document.getElementById('buildLabel');

buildLabel.textContent = `${WEB_PHONE_BUILD} • ${WS_URL}`;

function toggleCall() {
  if (connected) hangup(); else startCall();
}

async function startCall() {
  btn.disabled = true;
  statusText.textContent = 'Connecting…';
  transcript.innerHTML = '';
  lastFinalUserText = '';

  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: { sampleRate: TARGET_SAMPLE_RATE, channelCount: 1, echoCancellation: true, noiseSuppression: true } });
  } catch (e) {
    statusText.textContent = 'Microphone access denied';
    statusDot.className = 'status-dot error';
    btn.disabled = false;
    return;
  }

  try {
    await startMicCapture();
  } catch (e) {
    console.error('Audio init error:', e);
    statusText.textContent = 'Audio init failed';
    statusDot.className = 'status-dot error';
    if (scriptNode) { scriptNode.disconnect(); scriptNode = null; }
    clearAudioPlayback();
    if (playbackNode) { playbackNode.disconnect(); playbackNode = null; }
    if (audioCtx) { audioCtx.close().catch(() => {}); audioCtx = null; }
    if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
    btn.disabled = false;
    return;
  }

  const url = TOKEN ? `${WS_URL}?token=${encodeURIComponent(TOKEN)}` : WS_URL;
  ws = new WebSocket(url);

  ws.onopen = () => {
    connected = true;
    statusDot.className = 'status-dot connected';
    statusText.textContent = 'Connected';
    btn.textContent = '📞 Hang Up';
    btn.className = 'btn btn-hangup';
    btn.disabled = false;
    startSpeechRecognition();
  };

  ws.onmessage = (evt) => {
    try {
      const msg = JSON.parse(evt.data);
      switch (msg.type) {
        case 'audio': queueAudio(msg.data); break;
        case 'audio_clear': clearAudioPlayback(); break;
        case 'transcript': addTranscript(msg.text, msg.role, msg.final); break;
        case 'state': setState(msg.value); break;
        case 'ended': hangup(); break;
      }
    } catch (e) { console.error('Parse error:', e); }
  };

  ws.onerror = () => {
    statusText.textContent = 'Connection error';
    statusDot.className = 'status-dot error';
  };

  ws.onclose = () => {
    if (connected) hangup();
  };
}

function hangup() {
  stopSpeechRecognition();
  if (ws && ws.readyState === WebSocket.OPEN) {
    try { ws.send(JSON.stringify({ type: 'hangup' })); } catch {}
  }
  cleanup();
}

function cleanup() {
  connected = false;
  stopSpeechRecognition();
  if (scriptNode) { scriptNode.disconnect(); scriptNode = null; }
  clearAudioPlayback();
  if (playbackNode) { playbackNode.disconnect(); playbackNode = null; }
  if (audioCtx) { audioCtx.close().catch(() => {}); audioCtx = null; }
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  if (ws) { ws.close(); ws = null; }
  statusDot.className = 'status-dot';
  statusText.textContent = 'Disconnected';
  stateLabel.textContent = '';
  stateLabel.className = 'state-label';
  btn.textContent = '🎤 Call';
  btn.className = 'btn btn-call';
  btn.disabled = false;
}

async function startMicCapture() {
  audioCtx = new AudioContext({ sampleRate: 48000 });
  playbackNode = await createPlaybackNode(audioCtx);
  const source = audioCtx.createMediaStreamSource(micStream);
  // Use ScriptProcessorNode for broad compatibility
  const bufSize = 4096;
  scriptNode = audioCtx.createScriptProcessor(bufSize, 1, 1);
  const nativeSR = audioCtx.sampleRate;

  scriptNode.onaudioprocess = (e) => {
    if (!connected || !ws || ws.readyState !== WebSocket.OPEN) return;
    const input = e.inputBuffer.getChannelData(0);
    // Resample to 16kHz
    const ratio = nativeSR / TARGET_SAMPLE_RATE;
    const outLen = Math.floor(input.length / ratio);
    const pcm16 = new Int16Array(outLen);
    for (let i = 0; i < outLen; i++) {
      const srcPos = i * ratio;
      const idx = Math.floor(srcPos);
      const frac = srcPos - idx;
      const s0 = input[idx] || 0;
      const s1 = input[Math.min(idx + 1, input.length - 1)] || 0;
      const val = s0 + frac * (s1 - s0);
      pcm16[i] = Math.max(-32768, Math.min(32767, Math.round(val * 32767)));
    }
    const bytes = new Uint8Array(pcm16.buffer);
    ws.send(JSON.stringify({ type: 'audio', data: btoa(String.fromCharCode(...bytes)) }));
  };

  source.connect(scriptNode);
  scriptNode.connect(audioCtx.destination); // required for onaudioprocess to fire
}

function clearAudioPlayback() {
  if (!playbackNode) return;
  try { playbackNode.port.postMessage({ type: 'clear' }); } catch {}
}

function queueAudio(base64) {
  if (!audioCtx || !playbackNode) return;

  // Decode base64 PCM 16kHz 16-bit mono
  const raw = atob(base64);
  const bytes = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
  const pcm16 = new Int16Array(bytes.buffer);
  // Convert to float32
  const float32 = new Float32Array(pcm16.length);
  for (let i = 0; i < pcm16.length; i++) float32[i] = pcm16[i] / 32768;

  // Resample 16kHz → audioCtx.sampleRate for playback
  const outSR = audioCtx.sampleRate;
  const ratio = TARGET_SAMPLE_RATE / outSR;
  const outLen = Math.round(float32.length / ratio);
  if (outLen <= 0) return;

  const resampled = new Float32Array(outLen);
  for (let i = 0; i < outLen; i++) {
    const srcPos = i * ratio;
    const idx = Math.floor(srcPos);
    const frac = srcPos - idx;
    const s0 = float32[idx] || 0;
    const s1 = float32[Math.min(idx + 1, float32.length - 1)] || 0;
    resampled[i] = s0 + frac * (s1 - s0);
  }

  playbackNode.port.postMessage(resampled, [resampled.buffer]);
}

async function createPlaybackNode(ctx) {
  if (!ctx.audioWorklet) {
    throw new Error('AudioWorklet is not supported in this browser.');
  }

  const blob = new Blob([PCM_PLAYER_WORKLET_SOURCE], { type: 'application/javascript' });
  const moduleUrl = URL.createObjectURL(blob);
  try {
    await ctx.audioWorklet.addModule(moduleUrl);
  } finally {
    URL.revokeObjectURL(moduleUrl);
  }

  const node = new AudioWorkletNode(ctx, PCM_PLAYER_PROCESSOR_NAME, {
    numberOfInputs: 0,
    numberOfOutputs: 1,
    outputChannelCount: [1],
    processorOptions: {
      ringBufferSeconds: PLAYBACK_RING_BUFFER_SECONDS,
      primeMs: PLAYBACK_PRIME_MS
    }
  });
  node.connect(ctx.destination);
  return node;
}

function normalizeTranscriptText(value) {
  return (value || '').trim().replace(/\s+/g, ' ');
}

function restartSpeechRecognition() {
  if (!speechRecog || !speechRecogShouldRestart || !connected) return;
  speechRecogMuted = false;
  try {
    speechRecog.start();
  } catch (error) {
    const errorName = error && error.name ? error.name : '';
    if (errorName !== 'InvalidStateError') {
      console.warn('SpeechRecognition restart failed:', error);
    }
  }
}

function startSpeechRecognition() {
  if (!SpeechRecognition || !connected) return;

  if (!speechRecog) {
    speechRecog = new SpeechRecognition();
    speechRecog.continuous = true;
    speechRecog.interimResults = true;
    speechRecog.lang = 'en-US';

    speechRecog.onresult = (event) => {
      if (!connected || speechRecogMuted) return;
      // Concatenate all results (final phrases + current interim) into one string
      let full = '';
      for (let i = 0; i < event.results.length; i++) {
        const alt = event.results[i][0];
        if (alt && alt.transcript) full += alt.transcript;
      }
      if (normalizeTranscriptText(full)) {
        addTranscript(full, 'user', false);
      }
    };

    speechRecog.onend = () => {
      if (!speechRecogShouldRestart || !connected) return;
      restartSpeechRecognition();
    };

    speechRecog.onerror = (event) => {
      const errorCode = event && event.error ? event.error : 'unknown';
      console.warn('SpeechRecognition error:', errorCode);
      if (errorCode === 'not-allowed' || errorCode === 'service-not-allowed') {
        speechRecogShouldRestart = false;
        return;
      }
      if (!speechRecogShouldRestart || !connected) return;
      if (errorCode === 'no-speech' || errorCode === 'aborted' || errorCode === 'audio-capture' || errorCode === 'network') {
        restartSpeechRecognition();
      }
    };
  }

  speechRecogShouldRestart = true;
  restartSpeechRecognition();
}

function resetSpeechRecognition() {
  // Mute immediately to ignore any trailing events, then stop and restart
  speechRecogMuted = true;
  if (!speechRecog || !speechRecogShouldRestart || !connected) return;
  try { speechRecog.stop(); } catch {}
  // onend handler will auto-restart since speechRecogShouldRestart is true
}

function stopSpeechRecognition() {
  speechRecogShouldRestart = false;
  if (!speechRecog) return;
  speechRecog.onresult = null;
  speechRecog.onend = null;
  speechRecog.onerror = null;
  try { speechRecog.stop(); } catch {}
  speechRecog = null;
}

function addTranscript(text, role, final) {
  const normalized = normalizeTranscriptText(text);

  // For non-final user partials, update the existing partial element in-place
  if (role === 'user' && !final) {
    // Only reuse a partial if it's the last message (not followed by agent/final messages)
    let partial = transcript.lastElementChild && transcript.lastElementChild.classList.contains('partial')
      ? transcript.lastElementChild : null;
    if (!partial) {
      partial = document.createElement('div');
      partial.className = 'msg user partial';
      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = 'You';
      partial.appendChild(label);
      const body = document.createElement('div');
      body.appendChild(document.createTextNode(''));
      partial.appendChild(body);
      transcript.appendChild(partial);
    }

    if (normalizeTranscriptText(partial.lastElementChild.textContent) !== normalized) {
      partial.lastElementChild.textContent = text;
    }
    transcript.scrollTop = transcript.scrollHeight;
    return;
  }

  if (role === 'user' && final) {
    // Reset browser SpeechRecognition to clear accumulated results for next turn
    resetSpeechRecognition();

    // De-dupe duplicated final user events from STT/providers.
    if (normalized && normalized === lastFinalUserText) {
      const lastEl = transcript.lastElementChild;
      if (lastEl && lastEl.classList.contains('partial')) lastEl.remove();
      return;
    }

    const last = transcript.lastElementChild;
    const partial = last && last.classList.contains('partial') ? last : null;
    if (partial) {
      partial.classList.remove('partial');
      partial.lastElementChild.textContent = text;
      lastFinalUserText = normalized;
      transcript.scrollTop = transcript.scrollHeight;
      return;
    }

    lastFinalUserText = normalized;
  }

  // Agent transcripts (always final) or final user with no preceding partial
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = role === 'user' ? 'You' : 'Agent';
  const body = document.createElement('div');
  body.textContent = text;
  div.appendChild(label);
  div.appendChild(body);
  transcript.appendChild(div);
  transcript.scrollTop = transcript.scrollHeight;
}

function setState(value) {
  stateLabel.textContent = value;
  stateLabel.className = `state-label ${value}`;
}
</script>
</body>
</html>
